name = "esprey-expenses-app"
compatibility_date = "2026-06-01"
pages_build_output_dir = "./dist"

# Plain (non-secret) environment variables
[vars]
CARL_EMAIL = "cesprey@gmail.com"
REPORT_FROM_ADDRESS = "reports@esprey.net"  # must match a Resend-verified domain

# Invoice "BILL FROM" block — your business details
BILL_FROM_NAME    = "Carl Esprey"
BILL_FROM_LINE1   = "207 Rua Praia do Moinho"
BILL_FROM_LINE2   = "Carcavelos, Cascais, 2775-681"
BILL_FROM_COUNTRY = "Portugal"

# Payment details printed at the bottom of every invoice
BANK_NAME  = "Millennium BCP"
BANK_IBAN  = "PT50 0033 0000 45669096226 05"
BANK_SWIFT = "BCOMPTPL"

# D1 database binding (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "esprey-expenses-app"
database_id = "a36389a8-49d4-4101-b7c0-fb0a17299e62"

# R2 bucket binding (original receipt images)
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "esprey-expenses-app-receipts"

# Secrets and plain env vars (CARL_EMAIL, ANTHROPIC_API_KEY, SESSION_SECRET,
# RESEND_API_KEY) are set via the Cloudflare dashboard under
# Settings → Variables and Secrets — NOT committed here.
