<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />

  <!-- Favicon (browser tabs) -->
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />

  <!-- iPhone home screen + macOS Safari "Add to Dock" -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Expenses" />

  <!-- Fonts are self-hosted under /fonts (see src/styles.css); preload the two the first paint needs -->
  <link rel="preload" href="/fonts/SchibstedGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/IBMPlexMono-500-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Web app manifest (Android + PWA install) -->
  <link rel="manifest" href="/manifest.json" />

  <title>Esprey Expenses</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
